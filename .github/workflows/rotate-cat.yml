name: Daily Cat Rotation

on:
  schedule:
    # 毎日午前3時17分 (UTC) に実行
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      cat:
        description: '表示する猫画像 (auto = 日付で自動選択)'
        type: choice
        options:
          - auto
          - '1'
          - '2'
          - '3'
        default: auto
        required: false

# トップレベルでは読み取り専用、書き込みはジョブで明示的に付与
permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    
    # 同時実行を防止（前回実行が完了するまで待機）
    concurrency:
      group: daily-cat-rotation
      cancel-in-progress: false
    
    # このジョブのみ書き込み権限を付与
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          token: ${{ github.token }}

      - name: Rotate cat image
        # scripts/rotate-cat.ts を scriptc でビルドした Linux x64 バイナリ
        # (README.md を更新し、CHANGED=true/false を $GITHUB_ENV に書き出す)
        # 入力値は run に直接埋め込まず env 経由で渡す (スケジュール実行時は空 = auto)
        env:
          CAT_INDEX_OVERRIDE: ${{ inputs.cat }}
        run: |
          set -euo pipefail
          ./bin/rotate-cat

      - name: Commit and push if changed
        if: env.CHANGED == 'true'
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "🐱 Daily cat rotation"
          git push
